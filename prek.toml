# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
minimum_pre_commit_version = "3.6.0"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.4.0"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1000"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "debug-statements"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "pretty-format-json"
args = ["--autofix", "--indent=2", "--no-ensure-ascii"]

[[repos.hooks]]
id = "trailing-whitespace"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.4"

[[repos.hooks]]
id = "ruff-check"

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.74"

[[repos.hooks]]
id = "ty"

[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.38.0"

[[repos.hooks]]
id = "yamllint"
args = ["--strict", "--config-file=.yamllint.yml"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["--verbose"]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.2"

[[repos.hooks]]
id = "markdownlint-cli2"
args = ["--fix"]
files = '\.md$'
language_version = "system"

[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"

[[repos.hooks]]
id = "hadolint-docker"
args = ["--config", ".hadolint.yaml"]

[[repos]]
repo = "https://github.com/koalaman/shellcheck-precommit"
rev = "v0.11.0"

[[repos.hooks]]
id = "shellcheck"

[[repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "1.8.3"

[[repos.hooks]]
id = "bandit"
args = ["-c", "pyproject.toml"]

[[repos]]
repo = "https://github.com/pypa/pip-audit"
rev = "v2.8.0"

[[repos.hooks]]
id = "pip-audit"
args = ["--ignore-vuln", "PYSEC-2026-196"]
# PYSEC-2026-196: vulnerability in pip itself (<=26.1.1), not a project
# dependency. Remove once the hook env picks up pip 26.1.2+.

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

[[repos.hooks]]
id = "actionlint"
files = '\.github/workflows/.*\.yml$'

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.12.0-2"

[[repos.hooks]]
id = "shfmt"
args = ["-i", "2", "-ci", "-s", "-bn"]
files = '\.sh$'

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"
args = ["--write-changes"]

[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "v1.5.0"

[[repos.hooks]]
id = "detect-secrets"
args = ["--baseline", ".secrets.baseline"]

[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
rev = "44.39.2"

[[repos.hooks]]
id = "renovate-config-validator"

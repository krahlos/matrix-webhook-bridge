---
name: "Startup Smoke Test"
description: "Verifies the bridge can start without errors"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"
  config-path:
    description: "Path to the config file for testing"
    required: false
    default: "bridge.yml.example"
  timeout-seconds:
    description: "How long to let the server run before killing it"
    required: false
    default: "5"
  expect-log:
    description: "Optional substring that must appear in the server's log output"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: pip install "."

    - name: Test Startup
      # Start the server and kill it after timeout-seconds. timeout returns
      # 124 if the command was interrupted by the timeout, which means the
      # server started successfully and stayed alive.
      shell: bash
      run: |
        set -o pipefail
        log_file="$(mktemp)"
        timeout "${{ inputs.timeout-seconds }}s" python dev_serve.py serve \
          --config "${{ inputs.config-path }}" 2>&1 | tee "$log_file"
        status="${PIPESTATUS[0]}"
        if [ "$status" -ne 124 ]; then
          echo "Server exited early with status $status"
          exit 1
        fi

        expected="${{ inputs.expect-log }}"
        if [ -n "$expected" ] && ! grep -qF "$expected" "$log_file"; then
          echo "Expected log line not found: $expected"
          exit 1
        fi

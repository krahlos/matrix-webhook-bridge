---

name: "Pull Request"
run-name: "PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}"

on:
  pull_request:

permissions: {}

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dockerfile:
              - Dockerfile
            src:
              - ".github/actions/smoke_test/**"
              - "matrix_webhook_bridge/**"
              - "tests/**"
              - dev_serve.py
              - pyproject.toml

  prek:
    name: Prek Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run prek hooks
        uses: j178/prek-action@v3.0.0

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [prek, changes]
    if: needs.changes.outputs.src == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Run tests
        run: pytest

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [run-tests, changes]
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run Smoke Test
        uses: ./.github/actions/smoke_test

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [run-tests, smoke-test, changes]
    if: >-
      always() &&
      needs.changes.outputs.dockerfile == 'true' &&
      (needs.changes.outputs.src != 'true' || needs.smoke-test.result == 'success') &&
      needs.run-tests.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Build Metadata
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_VERSION="0.0.0-pr.${{ github.event.number }}"
          else
            IMAGE_VERSION="0.0.0-sha.${GITHUB_SHA::7}"
          fi

          {
            echo "IMAGE_VERSION=${IMAGE_VERSION}"
            echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "IMAGE_REVISION=${{ github.sha }}"
          } >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            MAINTAINER=${{ github.actor }}
            IMAGE_REVISION=${{ env.IMAGE_REVISION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

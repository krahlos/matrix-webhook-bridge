---

name: "Main"
run-name: "CI · ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Run tests
        run: pytest

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v7
      - name: Run Smoke Test
        uses: ./.github/actions/smoke_test

  smoke-test-autojoin-failure:
    name: Smoke Test (autojoin failure)
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v7
      - name: Run Smoke Test
        uses: ./.github/actions/smoke_test
        with:
          config-path: .github/actions/smoke_test/autojoin-failure.yml
          timeout-seconds: "20"
          expect-log: "autojoin failed: invite failed"

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [run-tests, smoke-test]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Build Metadata
        run: |
          {
            echo "IMAGE_VERSION=0.0.0-sha.${GITHUB_SHA::7}"
            echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "IMAGE_REVISION=${{ github.sha }}"
          } >> "$GITHUB_ENV"

      # This tag is local to the runner: load: true keeps it in the job's own
      # Docker daemon for the smoke test below and it is never pushed anywhere.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: matrix-webhook-bridge:main
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            MAINTAINER=${{ github.actor }}
            IMAGE_REVISION=${{ env.IMAGE_REVISION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Run Docker Smoke Test
        uses: ./.github/actions/docker_smoke_test
        with:
          image: matrix-webhook-bridge:main
